name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to test.
        required: true
        default: 0.0.0-test
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  RUNTIME: win-x64
  PACKAGE_NAME: SteamHidBridge-win-x64.zip
  UPDATER_NAME: SteamHidBridge-updater.ps1

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install PlatformIO
        shell: pwsh
        run: python -m pip install platformio

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $version = "${{ inputs.version }}"
          }
          else {
              $tag = "${{ github.ref_name }}"
              if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
                  throw "Release tags must match vMAJOR.MINOR.PATCH, for example v0.1.1. Got '$tag'."
              }

              $version = $tag.Substring(1)
          }

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: .\scripts\check.ps1 -Configuration Release

      - name: Package
        shell: pwsh
        run: .\scripts\release.ps1 -Configuration Release -Runtime $env:RUNTIME -Version $env:VERSION

      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = Join-Path "artifacts" $env:PACKAGE_NAME
          $updater = Join-Path "artifacts" $env:UPDATER_NAME
          gh release create $tag $asset $updater --verify-tag --title "Steam HID Bridge $tag" --generate-notes

      - name: Upload package artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: SteamHidBridge-${{ env.RUNTIME }}
          path: |
            artifacts/${{ env.PACKAGE_NAME }}
            artifacts/${{ env.UPDATER_NAME }}
          archive: false
